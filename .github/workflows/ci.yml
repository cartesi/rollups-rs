name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The Cartesi Machine release the machine crates link, and the SHA-256 of its
  # amd64 package (ubuntu-latest).
  CARTESI_MACHINE_VERSION: 0.21.0
  CARTESI_MACHINE_SHA256: 5f13034f43454c340062c677146daabe77c587cee1bd60342c95b8ad8f1463a3

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cartesi/setup-action@bb00b3ff0dcb20119f6029883122411cb9640857 # v1.2.0
        with:
          machine-version: ${{ env.CARTESI_MACHINE_VERSION }}
          machine-checksum: ${{ env.CARTESI_MACHINE_SHA256 }}
          machine-images: false
          xgenext2fs-version: none
          cli-version: none
          setup-qemu: false
      # The release's static libcartesi references libslirp.
      - run: sudo apt-get install -y libslirp-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-images
          key: test-images-${{ runner.os }}-${{ hashFiles('scripts/prepare-test-images.sh') }}-${{ env.CARTESI_MACHINE_VERSION }}
      - name: Prepare test images
        run: scripts/prepare-test-images.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (remote_machine)
        run: cargo clippy -p cartesi-machine --features remote_machine --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Builds every crate from its packaged sources, as crates.io will.
      - name: Package
        run: cargo package --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cartesi/setup-action@bb00b3ff0dcb20119f6029883122411cb9640857 # v1.2.0
        with:
          machine-version: ${{ env.CARTESI_MACHINE_VERSION }}
          machine-checksum: ${{ env.CARTESI_MACHINE_SHA256 }}
          machine-images: false
          xgenext2fs-version: none
          cli-version: none
          setup-qemu: false
      # The release's static libcartesi references libslirp.
      - run: sudo apt-get install -y libslirp-dev
      - run: cargo check --workspace --all-targets --locked

  guest:
    name: guest (riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-musl
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross
      - name: Build guest crates
        run: cross build --target riscv64gc-unknown-linux-musl -p cartesi-rollup --locked
