# Opens the release pull request while changesets are pending, and publishes
# the bumped crates once it is merged. See CONTRIBUTING.md#releasing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Cartesi Machine release the machine crates link, and the SHA-256 of its
  # amd64 package (ubuntu-latest).
  CARTESI_MACHINE_VERSION: 0.21.0
  CARTESI_MACHINE_SHA256: 5f13034f43454c340062c677146daabe77c587cee1bd60342c95b8ad8f1463a3

jobs:
  release:
    if: github.repository == 'cartesi/rollups-rs'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the release branch, tags and GitHub releases
      pull-requests: write # open and update the release pull request
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # `cargo publish` builds each crate, and cartesi-machine-sys links the
      # installed emulator.
      - uses: cartesi/setup-action@bb00b3ff0dcb20119f6029883122411cb9640857 # v1.2.0
        with:
          machine-version: ${{ env.CARTESI_MACHINE_VERSION }}
          machine-checksum: ${{ env.CARTESI_MACHINE_SHA256 }}
          machine-images: false
          xgenext2fs-version: none
          cli-version: none
          setup-qemu: false
      # The release's static libcartesi references libslirp.
      - run: sudo apt-get install -y libslirp-dev

      # Pending changesets mean this run only prepares the release pull
      # request; without them, Sampo publishes whatever is unpublished.
      - name: Authenticate to crates.io
        id: crates-io
        if: hashFiles('.sampo/changesets/*.md') == ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Release or publish
        uses: bruits/sampo/crates/sampo-github-action@f7241754458e1be4073902b2860596340c7d089c # sampo-github-action-v0.15.4
        with:
          command: auto
          cargo-token: ${{ steps.crates-io.outputs.token }}
          create-github-release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
