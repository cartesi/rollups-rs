[package]
name = "cartesi-machine"
version = "0.21.0"
description = "Safe Rust bindings to the Cartesi Machine emulator"
documentation = "https://docs.rs/cartesi-machine"
readme = "README.md"
keywords = ["cartesi", "emulator", "risc-v", "rollups"]
categories = ["api-bindings", "emulators"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
# Link `libcartesi_jsonrpc.a`, the client for remote machines, instead of the
# local emulator.
remote_machine = ["cartesi-machine-sys/remote_machine"]

[dependencies]
cartesi-machine-sys.workspace = true

base64 = "0.22"
derive_builder = "0.20"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.16"

[lints]
workspace = true
